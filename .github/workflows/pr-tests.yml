name: PR tests

# The merge train names this workflow in its `workflow_run` trigger — renaming
# it silently un-hooks the retest-done signal (see automerge.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # "ISR, not a static export" is a property of the build output, so it is
      # asserted against the build output rather than trusted from the config.
      - name: Verify the ISR delivery model
        run: npm run verify:isr

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs against a local dev server. The public half of this suite also runs
      # against the real deployment in `deployed-accessibility.yml`; this copy is
      # what catches an axe regression before it is ever deployed, and it is the
      # only place the admin screens are exercised at all — they need the
      # throwaway database a local server opens (`src/lib/db/client.ts`), and
      # signing into a deployment is not a thing this suite may do.
      - name: Browser tests (axe, admin)
        run: npm run test:e2e

      # Separate run, not a separate project: this one's dev server revalidates
      # a dead origin so the failure is real, and Astro allows one dev server per
      # project directory.
      - name: Browser tests (forced revalidation failure)
        run: npm run test:e2e:revalidation

      # The stale-ISR precondition (#34): with the database stopped, every
      # public route must fail rather than answer 200. A 2xx is what the CDN
      # caches over the good copy, so a page that swallows its own store error
      # is the one way stale-on-error never engages. Its own run for the same
      # reason as the one above — a third dev server, configured to be broken in
      # a third way.
      - name: Browser tests (stopped database)
        run: npm run test:e2e:database-down

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
